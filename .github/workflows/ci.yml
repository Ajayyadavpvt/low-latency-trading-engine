name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-asan:
    name: AddressSanitizer Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
    steps:
    - uses: actions/checkout@v5

    - name: Configure CMake (ASan)
      run: |
        mkdir build-asan
        cd build-asan
        cmake -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -O1 -g" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" ..

    - name: Build
      run: |
        cd build-asan
        cmake --build . --parallel $(nproc)

    - name: Run tests (skip stress)
      run: |
        cd build-asan
        ctest --output-on-failure -E "stress"

  test-tsan:
    name: ThreadSanitizer Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TSAN_OPTIONS: halt_on_error=1:abort_on_error=1:history_size=7
    steps:
    - uses: actions/checkout@v5

    - name: Configure CMake (TSan with Clang)
      run: |
        mkdir build-tsan
        cd build-tsan
        cmake -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -O1 -g" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" ..

    - name: Build
      run: |
        cd build-tsan
        cmake --build . --parallel $(nproc)

    - name: Run tests (skip stress)
      run: |
        cd build-tsan
        ctest --output-on-failure -E "stress"

  stress-tests:
    name: Stress Tests (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --parallel $(nproc)

    - name: Run stress tests
      run: |
        cd build
        ctest -R stress_tests --output-on-failure